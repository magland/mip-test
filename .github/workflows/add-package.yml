name: Add package

# Issue-driven submission flow.
#
# - on `issues: opened` for issues created from the "Add package" form:
#     validate the body, post a comment summarising what was detected,
#     and rewrite the title to a canonical form.
# - on `issue_comment: created` containing `approve` (on its own line)
#   from a user with write+ on the repo:
#     clone the source repo, copy packages/<name>/<version> into this
#     repo, commit + push, then dispatch build-package.yml for the
#     (package_path, architecture) extracted from the issue body.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  initial-response:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'add-package')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build validation comment
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .ci-tmp
          python3 scripts/add_package_from_issue.py validate \
            --output-file .ci-tmp/comment.md \
            --title-file .ci-tmp/title.txt

      - name: Post validation comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body-file .ci-tmp/comment.md

      - name: Rewrite title to canonical form
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CURRENT_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ ! -s .ci-tmp/title.txt ]; then
            echo "No canonical title — leaving title alone."
            exit 0
          fi
          new_title=$(head -n1 .ci-tmp/title.txt)
          if [ "$CURRENT_TITLE" = "$new_title" ]; then
            echo "Title already canonical."
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --title "$new_title"

  apply-on-approval:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'add-package') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Verify approval comment
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if ! printf '%s\n' "$COMMENT_BODY" | tr -d '\r' \
              | grep -iqE '^[[:space:]]*approve[[:space:]]*$'; then
            echo "No 'approve' line — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MIP_SYNC_TOKEN }}

      - name: Apply package addition
        if: steps.check.outputs.proceed == 'true'
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .ci-tmp
          python3 scripts/add_package_from_issue.py apply \
            --report-file .ci-tmp/report.md \
            --errors-file .ci-tmp/errors.md \
            --dispatch-file .ci-tmp/dispatch.tsv \
            --repo-root .
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.proceed == 'true' && steps.apply.outputs.has_changes == 'true'
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add package from issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch build-package workflow
        # Fire whenever apply produced a dispatch entry, even if there
        # was nothing to push (re-submitting an unchanged folder should
        # still re-trigger the build).
        if: steps.check.outputs.proceed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MIP_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s .ci-tmp/dispatch.tsv ]; then
            echo "No dispatch entries."
            echo "dispatched=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dispatched=""
          while IFS=$'\t' read -r pkg_path arch; do
            [ -z "$pkg_path" ] && continue
            echo "Dispatching build-package.yml: $pkg_path ($arch)"
            gh workflow run build-package.yml --repo "$REPO" \
              -f package_path="$pkg_path" \
              -f architecture="$arch"
            dispatched+="- \`$pkg_path\` (\`$arch\`)"$'\n'
          done < .ci-tmp/dispatch.tsv
          {
            echo "dispatched<<EOF"
            printf '%s' "$dispatched"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report back to issue
        if: always() && steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HAS_CHANGES: ${{ steps.apply.outputs.has_changes }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
          APPLY_RESULT: ${{ steps.apply.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
        run: |
          report=""
          errors=""
          if [ -f .ci-tmp/report.md ]; then
            report=$(cat .ci-tmp/report.md)
          fi
          if [ -f .ci-tmp/errors.md ]; then
            errors=$(cat .ci-tmp/errors.md)
          fi

          body=""
          if [ -n "$report" ]; then
            body+=$'**Added:**\n'"$report"$'\n'
          fi
          if [ -n "$errors" ]; then
            body+=$'\n**Errors:**\n'"$errors"$'\n'
          fi
          if [ "$PUSHED" = "true" ]; then
            body+=$'\nChanges pushed to `main`.\n'
          elif [ "$HAS_CHANGES" = "true" ] && [ "$COMMIT_RESULT" != "success" ]; then
            body+=$'\nFailed to commit/push changes — see the workflow run.\n'
          elif [ "$APPLY_RESULT" != "success" ]; then
            body+=$'\nWorkflow failed before changes could be applied — see the workflow run.\n'
          elif [ -n "$DISPATCHED" ]; then
            body+=$'\nNo file changes to push; re-dispatching the build.\n'
          else
            body+=$'\nNo changes were applied.\n'
          fi

          if [ -n "$DISPATCHED" ]; then
            body+=$'\n**Build dispatched:**\n'"$DISPATCHED"$'\n'
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"
