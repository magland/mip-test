name: Add package

# Free-form issue-driven submission flow, modelled on mip-core's
# add-package workflow.
#
# Submitters open an issue with:
#   - title:  "Add package ..."  OR a conforming package URL itself
#   - body:   one conforming package URL + one architecture keyword
#
# Conforming URL:
#   https://github.com/<owner>/<repo>/tree/<branch>/packages/<name>/<version>
#
# Architecture keywords: any, linux_x86_64, macos_arm64, windows_x86_64
#
# On issue open: validate, post a comment, rewrite the title canonically.
# On a comment containing `approve` from a user with write+ on the repo:
#   clone, copy folder, commit + push, then dispatch build-package.yml
#   for the parsed (package_path, architecture).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  initial-response:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Verify issue title
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          title_trimmed=$(printf '%s' "$ISSUE_TITLE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          title_lower=$(printf '%s' "$title_trimmed" | tr '[:upper:]' '[:lower:]')
          title_is_url=false
          if printf '%s' "$title_trimmed" \
              | grep -qE '^https://github\.com/[^/[:space:]]+/[^/[:space:]]+/tree/[^[:space:]]+$'; then
            title_is_url=true
          fi
          if [ "$title_is_url" = "true" ] \
              || printf '%s' "$title_lower" | grep -qE '^add package($|[^a-z])'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "title_is_url=$title_is_url" >> "$GITHUB_OUTPUT"
            echo "title_trimmed=$title_trimmed" >> "$GITHUB_OUTPUT"
          else
            echo "Title is neither 'add package ...' nor a conforming URL — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepend URL into issue body
        if: steps.check.outputs.proceed == 'true' && steps.check.outputs.title_is_url == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TITLE_URL: ${{ steps.check.outputs.title_trimmed }}
        run: |
          mkdir -p .ci-tmp
          if printf '%s' "$ISSUE_BODY" | grep -qF -- "$TITLE_URL"; then
            echo "URL already present in body — leaving body alone."
            exit 0
          fi
          { printf '%s\n\n' "$TITLE_URL"; printf '%s' "$ISSUE_BODY"; } > .ci-tmp/new_body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --body-file .ci-tmp/new_body.txt

      - name: Build validation comment
        if: steps.check.outputs.proceed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .ci-tmp
          python3 scripts/add_package_from_issue.py validate \
            --output-file .ci-tmp/comment.md \
            --title-file .ci-tmp/title.txt

      - name: Post validation comment
        if: steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body-file .ci-tmp/comment.md

      - name: Rewrite title to canonical form
        if: steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CURRENT_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ ! -s .ci-tmp/title.txt ]; then
            echo "No canonical title — leaving title alone."
            exit 0
          fi
          new_title=$(head -n1 .ci-tmp/title.txt)
          if [ "$CURRENT_TITLE" = "$new_title" ]; then
            echo "Title already canonical."
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --title "$new_title"

  apply-on-approval:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Verify trigger conditions
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          title_trimmed=$(printf '%s' "$ISSUE_TITLE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          title_lower=$(printf '%s' "$title_trimmed" | tr '[:upper:]' '[:lower:]')
          title_is_url=false
          if printf '%s' "$title_trimmed" \
              | grep -qE '^https://github\.com/[^/[:space:]]+/[^/[:space:]]+/tree/[^[:space:]]+$'; then
            title_is_url=true
          fi
          if [ "$title_is_url" != "true" ] \
              && ! printf '%s' "$title_lower" | grep -qE '^add package($|[^a-z])'; then
            echo "Title is neither 'add package ...' nor a conforming URL — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$COMMENT_BODY" | tr -d '\r' \
              | grep -iqE '^[[:space:]]*approve[[:space:]]*$'; then
            echo "Comment does not contain 'approve' on its own line — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MIP_SYNC_TOKEN }}

      - name: Apply package addition
        if: steps.check.outputs.proceed == 'true'
        id: apply
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .ci-tmp
          python3 scripts/add_package_from_issue.py apply \
            --report-file .ci-tmp/report.md \
            --errors-file .ci-tmp/errors.md \
            --dispatch-file .ci-tmp/dispatch.tsv \
            --repo-root .
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.proceed == 'true' && steps.apply.outputs.has_changes == 'true'
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add package from issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch build-package workflow
        # Fire whenever apply produced a dispatch entry, even if there
        # was nothing to push (re-submitting an unchanged folder should
        # still re-trigger the build).
        if: steps.check.outputs.proceed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MIP_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s .ci-tmp/dispatch.tsv ]; then
            echo "No dispatch entries."
            echo "dispatched=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dispatched=""
          while IFS=$'\t' read -r pkg_path arch; do
            [ -z "$pkg_path" ] && continue
            echo "Dispatching build-package.yml: $pkg_path ($arch)"
            gh workflow run build-package.yml --repo "$REPO" \
              -f package_path="$pkg_path" \
              -f architecture="$arch"
            dispatched+="- \`$pkg_path\` (\`$arch\`)"$'\n'
          done < .ci-tmp/dispatch.tsv
          {
            echo "dispatched<<EOF"
            printf '%s' "$dispatched"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report back to issue
        if: always() && steps.check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HAS_CHANGES: ${{ steps.apply.outputs.has_changes }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
          APPLY_RESULT: ${{ steps.apply.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
        run: |
          report=""
          errors=""
          if [ -f .ci-tmp/report.md ]; then
            report=$(cat .ci-tmp/report.md)
          fi
          if [ -f .ci-tmp/errors.md ]; then
            errors=$(cat .ci-tmp/errors.md)
          fi

          body=""
          if [ -n "$report" ]; then
            body+=$'**Added:**\n'"$report"$'\n'
          fi
          if [ -n "$errors" ]; then
            body+=$'\n**Errors:**\n'"$errors"$'\n'
          fi

          if [ "$PUSHED" = "true" ]; then
            body+=$'\nChanges pushed to `main`.\n'
          elif [ "$HAS_CHANGES" = "true" ] && [ "$COMMIT_RESULT" != "success" ]; then
            body+=$'\nFailed to commit/push changes — see the workflow run.\n'
          elif [ "$APPLY_RESULT" != "success" ]; then
            body+=$'\nWorkflow failed before changes could be applied — see the workflow run.\n'
          elif [ -n "$DISPATCHED" ]; then
            body+=$'\nNo file changes to push; re-dispatching the build.\n'
          else
            body+=$'\nNo changes were applied.\n'
          fi

          if [ -n "$DISPATCHED" ]; then
            body+=$'\n**Build dispatched:**\n'"$DISPATCHED"$'\n'
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"
