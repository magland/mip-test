name: Add package
description: Request a single package release be built and published on this channel.
title: "Add package: <url> (<architecture>)"
labels: [add-package]
body:
  - type: markdown
    attributes:
      value: |
        Submit one package release per issue. An admin (anyone with write
        access on this repo) will review and reply with `approve` on its
        own line to trigger the build.

  - type: input
    id: package_url
    attributes:
      label: Package URL
      description: |
        URL to the package release folder on GitHub, in this exact form:
        `https://github.com/<owner>/<repo>/tree/<branch>/packages/<name>/<version>`
      placeholder: https://github.com/owner/repo/tree/main/packages/my_pkg/1.0.0
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Target architecture for this build.
      options:
        - any
        - linux_x86_64
        - macos_arm64
        - windows_x86_64
    validations:
      required: true
